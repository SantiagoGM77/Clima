<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Weather</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" type="module"></script>
</head>
<body>
  <div class="container-global">
  <div class="header">

      </svg>
    </button>
  </div>
  <section class="container-inf-main">
    <article class="container-main-climate-current">
      <div class="container-top">
        <div class="container-degree-current">
          <p class="text-now-climate"></p>
          <div class="container-icon-and-degree">
            <p></p>
            <img alt="icon-climate" id="icon-climate-now"/>
          </div>
        </div>
        <div class="container-text-status-cloud-and-feeling">
          <p class="description-climate"></p>
          <p class="thermal-sensation"></p>
        </div>
      </div>
      <div class="container-center">
        <div class="container-degree-and-icon-next" id="container-climate-now">
          <p class="degree-text"></p>
          <div class="container-icon-and-hour">
            <img src="" alt="icon-climate">
            <p class="time"></p>
          </div>
        </div>
      </div>
    </article>
    <article class="container-icon-and-degree-next-days">
    </article>
    <article class="container-others-data-of-climate-now">
      <div id="container-rain" class="container-rain">
        <div class="container-icon-svg rain">

        </div>
        <div>
          <p class="text-property">Lluvia</p>
          <span></span>
        </div>
      </div>
      <div id="container-air">
        <div class="container-icon-svg not-rain">
          <svg width="20px" height="20px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M21 18C21 18 19.8096 17.5305 19 17.3021C13.8797 15.8574 10.1203 20.1426 5 18.6979C4.19041 18.4695 3 18 3 18M21 12C21 12 19.8096 11.5305 19 11.3021C13.8797 9.85739 10.1203 14.1426 5 12.6979C4.19041 12.4695 3 12 3 12M21 6C21 6 19.8096 5.53048 19 5.30206C13.8797 3.85739 10.1203 8.14261 5 6.69794C4.19041 6.46952 3 6 3 6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <p class="text-property">Viento</p>
          <span></span>
        </div>
      </div>
      <div id="container-humidity">
        <div class="container-icon-svg not-rain">
          <svg width="20px" height="20px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 21.5C16.1012 21.5 19.5 18.4372 19.5 14.5714C19.5 12.1555 18.2672 9.71249 16.8732 7.70906C15.4698 5.69214 13.8515 4.04821 12.9778 3.21778C12.4263 2.69364 11.5737 2.69364 11.0222 3.21779C10.1485 4.04821 8.53016 5.69214 7.1268 7.70906C5.73282 9.71249 4.5 12.1555 4.5 14.5714C4.5 18.4372 7.8988 21.5 12 21.5Z"/>
            <path d="M12 18C11.4747 18 10.9546 17.8965 10.4693 17.6955C9.98396 17.4945 9.54301 17.1999 9.17157 16.8284C8.80014 16.457 8.5055 16.016 8.30448 15.5307C8.10346 15.0454 8 14.5253 8 14" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <p class="text-property">Humedad</p>
          <span></span>
        </div>
      </div>
      <div id="container-quality-air">
        <div class="container-icon-svg not-rain">
          <svg width="20px" height="20px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M15.7639 7C16.3132 6.38625 17.1115 6 18 6C19.6569 6 21 7.34315 21 9C21 10.6569 19.6569 12 18 12H3M8.50926 4.66667C8.87548 4.2575 9.40767 4 10 4C11.1046 4 12 4.89543 12 6C12 7.10457 11.1046 8 10 8H3M11.5093 19.3333C11.8755 19.7425 12.4077 20 13 20C14.1046 20 15 19.1046 15 18C15 16.8954 14.1046 16 13 16H3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <p class="text-property">Calidad De Aire</p>
          <span class="container-quality-air"><span class="point"></span><span class="circle"></span><span class="quality-text"></span></span>
        </div>
      </div>
    </article>
    <div class="container-name-location">
      <span class="circle"></span>
      <p class="text-name-location"></p>
    </div>
  </section>
  </div>
</body>
</html>
